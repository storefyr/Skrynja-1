projekt_ordbog:
  sufflør: Det menneskelige led, der guider og korrigerer maskinelle stokastikere via præcise instruktioner.
  skrynja: Nynorsk for skrøne. Symbol på den maskinelle stokastikers tendens til fiktive narrativer.
  fremkaldelse: Processen med at bringe en specifik operationel tilstand eller identitet frem i en stokastiker.
  rekursiv_orkestrering: Styringsstruktur, hvor en stokastiker instrueres i at sufflere en anden stokastiker.
  maskinel_stokastiker: Stor sprogmodel (LLM), der opererer som eksekverende part under sufflørstyring.
  hårdknude: Udviklingsmæssig blindgyde eller systemisk fejl, hvor tilgangen fører til uoverstigelige problemer.
  ortografisk_krav: Krav om streng overholdelse af danske stave- og skrive-regler.
  kildekodelager: Det centrale depot for projektets kildekode, hvor versionsstyring og historik administreres.
  sko_a: Separat repo storefyr/Sko-a (GitHub-notifikations-app) — brugt 2026-11-09 til at måle GitHub API uden token (60 req/time pr. IP, se lokal_opsætning.github_api); ligger uden for dette projekts inventar
  vibe_ukendt_standardvalg: Midlertidigt navn for den aktuelle stokastiker i denne samtale — model kunne ikke identificeres hverken i app eller admin (sufflør 2026-11-11); omdøbes når modellen kendes

arkitektonisk_logik:
  struktur: RekursivOrkestrering (afledt visning — projekt_ordbog.rekursiv_orkestrering er normativ)
  flow: Sufflør → Stokastiker[n] → Output (afledt visning — projekt_ordbog er normativ)
  særlige_instrukser:
    rekursion: Stokastiker[n] kan sufflere Stokastiker[n+1]
    mål: Distribution af kognitiv belastning via lagdeling for at undgå systemiske hårdknuder

teknisk_stack:
  udstyr:
    enhed: se maskiner.eneste_enhed (samme fysiske enhed — ét sted at rette; os, arkitektur og kernel står her)
    os: Sailfish OS 5.2.0.20 (Finlayson)
    arkitektur: aarch64
    kernel: 6.12.38-4k
  maskiner:
    eneste_enhed: Jolla Phone 2026 — al projektfremdrift, agent-kørsel og stokastiker-dialogen foregår på denne ene enhed (sufflør 2026-11-07); mistral_vibe 3.0.2 + agent_client_protocol 0.11.0; vibe-acp via uv (~/.local/bin/vibe-acp); ingen separat målmaskine eller udviklermaskine
    arbejdsgange: GitHub Actions ubuntu-runners; Sailfish SDK-image 4.5.0.18-aarch64 — grøn i kørsel 42415519785
  integration:
    kerne_model: Mistral Vibe
    protokol: vibe-acp_ndjson_stdin_stdout
    implementering: Lokal_uv
  byg:
    sti: CI (GitHub Actions bygger aarch64 RPM); enheden bruges kun til install, kørsel og måling
    sdk_release: '4.5.0.18'
    sdk_note: 5.2.0.20-aarch64 findes ikke i ghcr.io (manifest unknown, kørsel 42415397767); 4.5.0.18-aarch64 er grøn i forgængerens CI og kører på enhedens 5.2.0.20
  standarder:
    ortografi: Dansk ortografi
    licens: GPL-3.0

selvtest:
  tilstand: appen kører med --selvtest, sætter mode ask via session/set_config_option og sender først probe-prompten når set_config_option-svaret er kommet, venter på end_turn; proben er deterministisk (sufflør 2026-11-10): «kør shell-kommandoen \"echo OK > /tmp/skrynja-1-probe.txt && cat /tmp/skrynja-1-probe.txt\" og inkluder uddata i svaret» — så outputs>0 følger af kommandoens egen uddata, ikke af agentens værktøjsvalg
  verdict_fil: /tmp/skrynja-1-selvtest.txt med felterne tool_calls, ui_tool_calls, permission_requests, probe_fil, diffs, outputs, config_options, session_load, genoptaget, replayed_user, mode, last_text, slut_aarsag (agent_afsluttet/agent_start_fejlede ved tidlig død; tom ved normal afslutning — målt tom på PASS-kørslerne 1184c07, 57d7ce3, 701f73a, 68c2b42/R13, e394164/R23, a5ded0d/R31), VERDICT — exit-koden følger PASS/FAIL; eksekver_test.sh tilføjer desuden efter appens linjer: byg_revision (fra revision.txt — hvilket main-commit bygget stammer fra), script_revision (klon efter pull), script_revision_ved_start (før pull, bevaret gennem genstart via miljøvariabel), artefakt_commit (test-rpm's commit-sha), artefakt_fil og artefakt_sha256 (sha256 af den artefakt der faktisk blev pakket ud — tar.gz hvis den vej bruges, ellers RPM) — og først efter at app-processen er standset (SIGTERM, SIGKILL efter højst 5 s, derefter høstning med wait uden tidsgrænse; scriptet venter desuden på en hel VERDICT=-linje), så appens egen skrivning ikke kan overskrive de tilføjede linjer; indført efter review ki_quick 2026-11-11; målt på c82aa02-kørslen (selvtest_c82aa02, udført af en ældre scriptudgave): artefaktfelterne (artefakt_commit/fil/sha256) set i kendelsen, byg_revision= ikke set — årsagen (ældre scriptudgave) er en slutning, ikke målt (tom revision.txt er nu udelukket af scriptets validering: 40-hex, exit 1). byg_revision= målt i kendelsen på b45759d (selvtest_b45759d) sammen med script_revision= og script_revision_ved_start= — alle tre = b45759d…; 2dbb3b6-kørslen skrev det gamle navn revision= (script ≤ c82aa02 ifølge feltnavnet)
  pass_kriterier: tool_calls større end 0, ui_tool_calls større end 0 (sættes af QML via acp.uiToolCallsSeen), permission_requests større end 0 (selvtest sætter mode ask først), probe_fil=OK (probe-filen /tmp/skrynja-1-probe.txt skal indeholde OK) og outputs større end 0 (deterministisk — proben kører cat, så uddata følger med når loopet virker; diffs rapporteres stadig, og diff-visning er dækket af unit-prøven diff_blokk_samles og målt på enheden på 3bd9a6b med diffs=2 — kriteriet står ikke i selvtesten fordi proben selv garanterer outputs, review ki_quick 2026-11-10) og config_options større end 0 (skive_konfiguration)
  kørsel: eksekver_test.sh på telefonen udskriver tre sporbare størrelser: script_revision (klonens tilstand efter pull — hvad denne kørsel faktisk kører), byg_revision (fra revision.txt — hvilket main-commit bygget stammer fra, også skrevet i kendelsen), artefakt_commit (hvilket test-rpm-commit artefakterne blev hentet fra)
  genoptagelse: almindelig kørsel genoptager gemt session via session/load; sessionId og samtaletekst gemmes under acp/sessionId og acp/lastText; under --selvtest ignoreres den gemte session og QSettings overskrives ikke — selvtest kører altid session/new (frisk session pr. kørsel, besluttet 2026-11-09, så historien ikke sendes frem og tilbage hver kørsel); verdict skriver session_load=fravalgt under selvtest; målt på enheden revision 18de24d — session_load=fravalgt (klienten sendte session/new, ikke load — ses også som fravær af session/load i wire-log [acp][out]), VERDICT=PASS, last_text kun probe+svar; NB replayed_user tæller også agentens ekko af den aktuelle prompt, så replayed_user=1 betyder kun proben — det er session_load=fravalgt plus fraværet af load på wire, der beviser at ingen historik blev sendt (før fix var replayed_user=10 på genoptagne sessioner); session/load tidligere målt ok med mcpServers:[] (se målt_på_wire.session_load)
  rate_limit:
    målt: "2026-11-09 — fire rate-limits før kvote-nulstilling; det er rate-limit pr. tidsvindue der nulstilles af sig selv, IKKE forbrugskvoten (kørsel selvtest_fd4cd46_fejl, revision fd4cd46)"
    forbrug: "39 af 255 euro brugt samme dag på admin.mistral.ai (enhed: euro; sufflør 2026-11-09)"
    vpn: "aktiv ved de første tre limits, fra ved den fjerde — uden betydning, ikke årsag"
    delt_konto: "samme Mistral-konto deles af Vibe Android-app og vibe-acp på telefonen, så Skrynja-1 rammes også"
    ved_limit: "hele svaret falder bort — intet delvist svar (målt af sufflør 2026-11-09); watchdog 30s skriver altid verdict mens appen kører, og dør agent-processen eller starter den ikke, skriver finishSelvtest også verdict; vent til vinduet er nulstillet og kør igen"
    gh_korrelation: "observeret 2026-11-09, årsag ikke bevist, modbevist to gange (NU! uden gh-kald; push 949d3ef uden limit) — ligner periodiske kvote-vinduer; ingen handlingsregel følger heraf i denne fil — praksis om lavt GitHub-forbrug aftales i dialogen (review ki_quick 2026-11-10)"
    github_note: "NB — dette er Mistrals limit; GitHub har sit eget (60 req/time uden token, se lokal_opsætning.github_api)"

arbejdsområder: flere, med forskellig varighed — (1) denne stokastikers sandkasse (/workspace/github__storefyr__Skrynja-1) er ikke varig: et lokalt commit forsvandt mellem to runder (målt 2026-11-11: 27496ad væk før push) og pushet er siden bekræftet i praksis som det der overlever (målt 2026-11-12: kun push'et data blev stående efter nulstilling); mekanismen bag nulstillingen er en slutning, ikke målt; (2) telefonens clone ~/Skrynja-1 er varigt (har overlevet alle runder — målt på telefonen, se projektlogbog telefon_klon_r5_r6) men kan være forældet — derfor auto-pull + exec-genstart i eksekver_test.sh; (3) fjernlageret (GitHub: main, test-rpm) er varigt og autoritativt; (4) ki_quicks område er målt 2026-11-12 at være en anden slags område: fire mapper (inputs/, output/, uploads/, work/), ingen config.yaml og ingen shell-scripts — kan ikke køre git eller sh -n; risikoen ligger i ventetiden mellem commit og push i hvert område, så færdige enheder bør ikke vente længe på signal
lokal_opsætning:
  maskiner_og_programmel: én fysisk enhed (teknisk_stack.maskiner.eneste_enhed) + CI — ingen ekstern udviklermaskine
  klient_lige_nu: Mistral Vibe Android-app på Jolla Phone 2026 (kun indtil Skrynja-1 er materialiseret); samtaler og deres navne håndteres i den app — uden for dette repos kontrol (sufflør 2026-11-08)
  klient_fremtid: Når Skrynja-1 overtager som klient, logges hver session automatisk i projektlogbogen ved session/new (sessionId + navn) — koblingen bliver stærk og automatisk, ikke manuel
  github_api: GitHub API uden token giver 60 req/time pr. IP (delt ved VPN) — ved API-brug fra telefonen brug read-only token i Sailfish.Secrets (SecretStorage, org.nemomobile.secrets), aldrig i repoet (målt via Sko-a 2026-11-09); GitHubs rate limit er noget andet end Mistrals — de hænger ikke sammen
  sufflør_viden: Så godt som ingen viden om GitHub, gh og git (sufflør 2026-11-07) — maskinsiden udfører alle git/gh-operationer; instruktioner til sufflør må ikke forudsætte git-kendskab
  testkørsel: eksekver_test.sh kører på telefonen selv — henter test-rpm's eget commit-sha via ét uautentificeret API-kald (ved 403 rate limit fejler kørslen med HTTP-fejl-besked, før noget hentes — 60 req/time pr. IP, se lokal_opsætning.github_api) og henter så revision.txt, RPM og tar.gz alle med det faste sha i stien (metodefejl_13/17 — raw cacher pr. sti, så gren-navne efter force-push kan give filer fra hver sit commit; målt sha-mismatch på enheden 2026-11-10), verificerer sha256 obligatorisk for RPM (manglende sha256sum eller RPM-.sha256 giver exit 1; CI publicerer .sha256 i samme commit); for tar.gz fejler hentning/verifikation/sha-mismatch blødt og falder tilbage til den sha256-verificerede RPM (bsdtar/rpm2cpio) — RPM'en er altid den gyldige reserve, og scriptet skriver byg_revision + script_revision + script_revision_ved_start + artefakt_commit + artefakt_fil + artefakt_sha256 (af den udpakkede artefakt) ind i kendelsesfilen; pakker ud i ~/skrynja-1-test-app (tar.gz først, ellers RPM via bsdtar/rpm2cpio; ingen root, ingen kodeord — devel-su-prompt viser kodeord i klartekst i nogle terminaler) og kører appen med --selvtest (eller kør prøvetur med argumentet kør); verdict i /tmp/skrynja-1-selvtest.txt; filtrerede loglinjer fra /tmp vises også; ingen manuel start eller prompt nødvendig; scriptet selv kører fra telefonens lokale clone — scriptet henter selv nyeste udgave i ~/Skrynja-1 (git pull --ff-only) før hver kørsel, udskriver script_revision (klon efter pull) og genstarter sig selv (exec sh "$0") hvis pull ændrede HEAD, så kørslen aldrig måler en anden udgave end den hævder; kør git -C ~/Skrynja-1 rev-parse HEAD før kørslen og sammenlign med scriptets script_revision-linje — efter exec-genstart ved pull er de pr. konstruktion ens, så en afvigelse eller «ukendt» kan komme af fejlet pull, manglende git eller ikke-klon (så kørte kørslen den gamle udgave); signaturen script_revision= gyldig + script_revision_ved_start=ukendt betyder at klonen ikke kunne måles før pull; script ≤ c82aa02 ifølge feltnavnet på 2dbb3b6-kørslen; ved pull-fejl gives advarsel og kørslen fortsætter med det lokale script; scriptet venter op til 60s på verdict (watchdog skriver senest 30s efter agent-processen er startet — opstartstid måles på enheden ved lejlighed); CI publicerer kun på test-rpm ved push til main, aldrig ved pull requests (en PR ville force-pushe test-rpm med et flette-sha der ikke findes på nogen gren); publiceringen ligger i jobbet publicer_test_rpm med needs: [enhedstests, byg, tjek_config] (henvis altid til job-navnet, ikke linjenumre), så test-rpm kun opdateres når alle tre jobs er grønne — rød test eller config-tjek giver ingen artefakt overhovedet, og det er hensigten, ikke en CI-fejl; før gating lå publiceringen i byg uden needs og en rød kørsel publicerede alligevel (målt på kørsel 42852165999 — historisk, gælder ikke længere); vent på publicer_test_rpm-jobbet; byg-tiden varierer med docker-cache (målt: 4m49s varm mod ~32min kold på kørsel 43037560780 vs 43035934895), så en halv time er kold-cache, ikke fast; seneste målt på enheden: PASS på a5ded0d (selvtest_a5ded0d/R31 — første kørsel hvor script_revision=a5ded0d ≠ byg_revision=e394164, ved_start=e394164, artefakt_commit=547cf5c; før også e394164/R23, 68c2b42/R13, 5b84f69, b45759d, 2dbb3b6, c82aa02, 9843a6c og 1184c07) med sha-pinnede artefakter verificeret, deterministisk probe (outputs>0) og artefaktfelter i kendelsen — kør altid git -C ~/Skrynja-1 rev-parse HEAD før kørslen (fuldt 40-tegns sha — scriptet udskriver også fuldt sha som script_revision, så --short ville vise falsk afvigelse) — se projektlogbog selvtest_a5ded0d
  ordbog_opslag: sh opslag.sh [ord] — henter først sha på main via ét API-kald (commits-enden) og henter så config.yaml med fuldt commit-sha i stien (metodefejl_13), skriver hvilken revision der blev læst; slår op i projekt_ordbogen (uden ord skrives hele ordbogen ud)
  forbudt: ingen fjern-pipes

sufflør_protokol:
  interaktions_model:
    hierarki: Sufflør → Stokastiker (afledt visning — projekt_ordbog er normativ)
    svar_krav: Funktionel præcision
    loop: Kritik aktiv
  svar_modus:
    format: Teknik fremfor narrativ
    filter: Ingen høflighedsfraser
    prioritet: Operationel løsning > Teoretisk perfektion
    kommandoer: Hver kommando der skal køres, står i sit eget kopierbare blok med blank linje før — også enkeltlinje-kommandoer, og også når svaret kun indeholder én; flere kommandoer i ét blok kun når de er beregnet på at køres sammen i én pipeline (sufflør 2026-11-08, skærpet 2026-11-12: altid hver sit element)
    tal_i_svar: Svar i almindeligt dansk uden udmålinger der ikke blev bedt om; rå tal (sekunder, sha'er, byte, verdict-felter, kørsels-id'er, fejltekster) bruges når de er svaret på spørgsmålet (målinger, verdict, sporbarhed) eller når sufflør siger at svaret suffleres videre til en anden stokastiker (sufflør 2026-11-10)
  ki_quick_kanal: konferering med ki_quick om commits — stokastikeren skriver en afgrænset besked mellem markørerne --- til ki_quick --- og --- /til ki_quick --- i dialogen; sufflør kopierer teksten manuelt over til ki_quick; der findes ingen direkte kanal (sufflør 2026-11-11)
  review_først: ved konferering om nye commits lægges de på en review-gren først (git push origin main:vibe/review-ki-quick-d01e2e), så ki_quick kan læse dem sha-pinnet; main flyttes først på ki_quicks signal, og review-grenen slettes først når git ls-remote bekræfter at main bærer commits (målt nødvendigt 2026-11-12: push før gennemgang gjorde aftalt signal umuligt at holde)

anti_mønstre:
  metodiske_fejl:
    - id: metodefejl_01
      metode: QJsonParseError::ExtraData antaget (navn fra nyere Qt)
      resultat: byg fejlede — ExtraData findes ikke i Qt 5.6 (kørsel 42489084980)
      lektie: Qt 5.6 hedder det GarbageAtEnd, samme offset-semantik
    - id: metodefejl_02
      metode: over-loft-linje satte discard-tilstand uden nulstilling ved linjeskift
      resultat: næste gyldige linje blev også kasseret, prøve rygrad_cap fejlede (kørsel 42489244332)
      lektie: tæller nulstilles når linjen er komplet; kun ufuldstændig buffer går i discard
    - id: metodefejl_03
      metode: håndskrevet testlinje med en ekstra lukkeparentes
      resultat: parser kasserede korrekt med illegal value, prøven fejlede (kørsel 42490284528)
      lektie: test-JSON valideres maskinelt før commit
    - id: metodefejl_04
      metode: EnterKey.onClicked sat til signal-kald sendButton.clicked() som udtryk
      resultat: QML-fejl Insufficient arguments på Qt 5.6 (app-log 2026-11-08T15:26)
      lektie: en handler kalder en funktion, ikke et signal som funktionsudtryk
    - id: metodefejl_05
      metode: SDK-release valgt efter enhedens OS-version (5.2.0.20)
      resultat: docker-image 5.2.0.20-aarch64 findes ikke, manifest unknown (kørsel 42415397767)
      lektie: byg efter et SDK-image der faktisk findes i registret (4.5.0.18); enhedens OS er noget andet
    - id: metodefejl_06
      metode: selvtest læste uiToolCalls på view->rootObject() (vinduet) i stedet for Page
      resultat: ui_tool_calls=-1 og VERDICT=FAIL selvom UI viste kaldet (selvtest på enhed 2026-11-08)
      lektie: læs samme objekt som QML viser — findChild på side-id, ikke rootObject
    - id: metodefejl_07
      metode: rootObject() brugt uden #include <QQuickItem>
      resultat: RPM-byg fejlede med invalid use of incomplete type (kørsel 42495526218)
      lektie: rootObject() returnerer QQuickItem*, som skal includes før brug
    - id: metodefejl_08
      metode: C++ læste QML-state via property-opslag og parent-kæde (Item.parent stopper før vinduet; QML-id'er er fil-scopede)
      resultat: ui_tool_calls målte -1 så 0 og selvtest FAIL, selvom UI viste kaldet (målt på enhed 2026-11-08, revision 849c36b og 81d9955)
      lektie: QML kalder selv tilbage til C++ via Q_INVOKABLE (acp.uiToolCallsSeen) — mål dér, ikke i QML-træet
    - id: metodefejl_09
      metode: Qt foreach-makroen brugt i app-kode
      resultat: byg fejlede med lambda-expression in unevaluated context i Sailfish SDK (kørsel 42499995419)
      lektie: brug almindelig for-løkke over QJsonArray i app-koden på denne platform
    - id: metodefejl_10
      metode: test-hjælpere (frie funktioner) defineret efter testklasserne og brugt i inline-medlemsfunktioner
      resultat: compile-fejl not declared in this scope to gange (kørsel 42500157658 og 42537105639)
      lektie: fremad-deklarer frie hjælpere øverst i filen, før første klasse
    - id: metodefejl_11
      metode: git ls-files uden core.quotepath=false brugt til at generere YAML flow-lister
      resultat: æøå-filnavne blev C-quotet med backslash-escape og gav ugyldig YAML (inventar-bygning denne session)
      lektie: altid git -c core.quotepath=false ls-files når output skal ind i YAML eller shell
    - id: metodefejl_12
      metode: eksekver_test.sh kørt med omdirigeret output mens devel-su spørger efter kodeord
      resultat: kodeordsprompten forsvinder og det ligner et hang (to hændelser 2026-11-09)
      lektie: historisk — hændelsen involverede devel-su; scriptet kører i dag uden root og med app-uddata til /dev/null, så omdirigeringslektionen gælder ikke længere og der er ingen tty-vagt (review ki_quick 2026-11-10)
    - id: metodefejl_13
      metode: script hentet fra raw.githubusercontent.com uden sha256-tjek
      resultat: forældet cachet udgave blev kørt to gange 2026-11-09 — også med ?v= cache-buster i query (raw cacher på stien alene)
      lektie: hent med fuldt commit-sha i stien (raw.githubusercontent.com/<sha>/fil) og verificer sha256sum før kørsel
    - id: metodefejl_14
      metode: over-loftslinje afsluttet med \n ryddede ikke m_buffer i AcpFrameReader::feed
      resultat: præfiks fra tidligere feed()-kald klæbte sig på næste gyldige linje, som blev kasseret — tavs datatab (kodelæsning review 2026-11-09; prøven rygrad_cap_rydder_praefiks tilføjet før fix, CI kører den)
      lektie: over-loftsgrenen skal også nulstille bufferen ved linjeskift — samme fejlklasse som metodefejl_02
    - id: metodefejl_15
      metode: rc=$? læst inde i then-grenen efter "if ! curl ..." — efter negation er $? altid 0, så HTTP-fejl kunne ikke skelnes fra netværksfejl
      resultat: diagnosen var død kode — altid "netværk/time-out (curl exit 0)" (kodelæsning review ki_quick 2026-11-10)
      lektie: opsaml exit-koden uden negation — rc=0; cmd || rc=$? — samme fejlklasse som metodefejl_03 (konstruktion der aldrig kan antage den ene gren)
    - id: metodefejl_16
      metode: fejltekst ved tool_call_update failed læst fra content[k].content.text i stedet for content[k].text (indholdsblokken er {"type":"text","text":…})
      resultat: errText blev tom og lastError faldt tilbage til «Værktøjskald fejlede» — prøven krævede kun ikke-tom streng og fangede det ikke (kodelæsning review ki_quick 2026-11-10)
      lektie: læs samme felt som den nærliggende gren; prøven skal påstå selve fejlteksten, ikke kun ikke-tom
    - id: metodefejl_17
      metode: artefakter (RPM + .sha256) hentet via gren-navnet test-rpm efter force-push — raw cacher pr. sti, så de to filer kunne komme fra hver sit commit
      resultat: sha256-mismatch fanget af det obligatoriske tjek på enheden (kørsel selvtest_44043f3_sha_mismatch, 2026-11-10) — rettelsen fangede metodefejl_13-skew i praksis
      lektie: hent altid via commit-sha i stien, også når CI lægger artefakter på en gren — gren-navne er mutable, commits er ikke; monotoni (fremadskridende rækkefølge som kontrol) gælder kun main — test-rpm omskrives ved hver publicering, så et baglæns svar på den gren er ikke bevis på gammelt svar (review ki_quick 2026-11-12)
    - id: metodefejl_18
      metode: prøveslot-navn med ø (selvtest_verdict_ved_agentdød) — moc kan ikke generere metacall for ikke-ascii navne
      resultat: Enhedstests-byg fejlede i CI (kørsel 42852165999, error: selvtest_verdict_ved_agentd not declared); app-bygget fejlede ikke fordi moc kun kører på tests
      lektie: C++-identifikatorer (også prøveslot-navne) i ascii — som eksisterende prøvenavne (raekkefoelge); æøå kun i config-nøgler, filnavne og dansk tekst, aldrig i kildekode-id'er (metacall-genererede id'er går gennem moc)
    - id: metodefejl_19
      metode: config-nøgle skrevet som arbejdsomraade (ascii-udvanding) lige efter metodefejl_18 havde sagt at C++ er ascii — vanen slog reglen
      resultat: kontrollen i tjek_config_synkronitet.sh fangede det ikke, fordi nøgle-kontrollen kun ser tegnmængden ^[a-zæøå_0-9']+$ og ikke kan skelne før/foer; fejlen blev fanget af sufflør, ikke af værktøjet — værktøjsbegrænsningen hører ved kontrollen, ikke ved nøglen
      lektie: læs navngivningsreglen før hver ny nøgle; kontrollen er en hvidliste over tilladte låneord (udvanding_tilladt) — sikrere end en negativ liste, der kun dækker det der allerede er sket; fejler 3b på et ægte ord, tilføjes det til udvanding_tilladt med begrundelse i commit-beskeden
    - id: metodefejl_20
      metode: en hentning, der giver ordret samme svar i flere runder, blev brugt som bekræftelse af hvad main/gren pegede på (review ki_quick 2026-11-12 — senere målt som cache-artefakt: samme data ad ny sti gav spidsen)
      resultat: "uafgjort" og "endepunktet fejler" blev hævdet på grundlag af en frossen kopi; fejlen lå i hentelaget, ikke i kilden
      lektie: samme svar flere runder på samme sti måler lageret, ikke kilden — mål altid igen ad en ny sti (cache-bryder eller andet endepunkt), før svaret tæller som bekræftelse; gælder også opslag.sh og eksekver_test.sh's API-kald
  systemiske_hårdknuder:
    - id: hårdknude_01
      beskrivelse: Afvisnings-loop i forgængeren storefyr/Skrynja (målt runde 12c-12f) — cancelled stoppede ikke agenten; 9x request_permission, 7x cancelled, 14 unikke toolCallIds
      løsning: To handlinger fra start — Stop sender session/cancel før cancelled; Afvis afviser kun den enkelte anmodning

målt_på_wire:
  kilde: app-log /tmp/skrynja-1-app.log på Jolla Phone 2026, 2026-11-08T15:25-15:26
  initialize_svar: protocolVersion 1, agentInfo @mistralai/mistral-vibe 3.0.2, authMethods inkl. browser-auth
  session_new_svar: sessionId som UUID, currentModeId accept-edits, configOptions med mode/model/thinking, modes ask/accept-edits/smart-approve/auto-approve
  update_typer: session/update med agent_message_chunk, agent_thought_chunk, user_message_chunk, usage_update, available_commands_update, tool_call — klienten viser agent_message_chunk og tool_call og håndterer også tool_call_update (status-opdatering; failed sætter lastError)
  prompt_svar: svar med result stopReason end_turn og usage
  request_permission: målt i forgængeren (runde 11/12) — anmodninger med id 0/1 og options (optionId og name), tom titel kan forekomme; cancelled uden session/cancel stoppede ikke agenten (hårdknude_01)
  set_config_option: målt i Skrynja-1 2026-11-08 (revision 2a9e328) — mode=ask sat via session/set_config_option virker; fil-skrivning i ask-mode udløste 1 request_permission; læsning (id -un) gjorde ikke (i accept-edits)
  session_load: målt 2026-11-09 — revision d7cb315 uden mcpServers: agenten svarer -32602 (missing field); revision c77fa0e med mcpServers:[] medsendt: load OK (session_load=ok) — agenten erklærer loadSession true; klienten gemmer stadig selv sessionId og samtaletekst i QSettings (acp/sessionId, acp/lastText) som fallback og første visning

åbne_punkter:
  åbent_punkt_01: løst 2026-11-08 — selvtest på enheden gav tool_calls=1 og VERDICT=PASS (agenten sender tool_call, klienten fanger det)
  åbent_punkt_02: løst 2026-11-08 — selvtest PASS på revision 7a3f52e med tool_calls=1 og ui_tool_calls=1 (QML-callback uiToolCallsSeen målte, at UI-bindingen kørte)
  åbent_punkt_03: løst 2026-11-08 — selvtest læser probe-filen og kræver probe_fil=OK; målt PASS på enheden, revision 760bc12 (tool_calls=1, ui_tool_calls=1, permission_requests=1, probe_fil=OK, mode=ask)
  åbent_punkt_04: beviser uden for repoet forældes (app-log og verdict i /tmp på enheden, Actions-logs udløber) — kun kørsels-id og revision i git består; accepteret begrænsning
  åbent_punkt_05: løst 2026-11-09 — dialoger via pageStack.push, PullDownMenu flyttet til ApplicationWindow; målt på 90b9c45 (ingen PageStack-fejl ved kørsel; resterende DialogHeader/PullDownMenu TypeErrors er Silica-støj ved opstart, ikke blokerende)
  åbent_punkt_06: løst 2026-11-09 — årsagen var at proben ikke kørte efter session/load-ok (ingen end_turn → watchdog); fix — probe kører efter både load-ok og new, watchdog 30s (samme som i koden), ingen dialog under selvtest, tekst capped i UI; målt PASS på 90b9c45 uden hæng
  åbent_punkt_07: tilladelsesdialog viste ikke hvad anmodningen gjaldt ved tom titel/kommando, og efter Allow Once kom intet synligt svar — fix 2026-11-09 — dialog falder tilbage til rå JSON, værktøjskald får status, fejl får banner (lastError); målt i app-log ved prøvetur 2026-11-09
  åbent_punkt_08: tilladelsesdialog lukkede ikke efter svar (reject()/pop på pushet dialog virkede ikke — svaret lå skjult bag knapperne); fix 2026-11-09 — tilladelse vises nu inline på siden og lukker via binding (hasPendingPermission), ingen Dialog/pageStack; indstillingsdialog har Luk-knap; målt i app-log ved prøvetur
  åbent_punkt_09: slet-session i UI findes ikke endnu (sufflør 2026-11-09) — selvtest kører nu frisk session, så behovet kun gælder manuel prøvetur; gemt session kan fjernes ved at slette acp/sessionId og acp/lastText i QSettings på telefonen
  åbent_punkt_10: hver lastText-chunk skriver 20000 tegn til QSettings (flash-skrivning pr. chunk) og m_lastText vokser ubegrænset i hukommelsen (kodelæsning review 2026-11-09) — forslag: debounce QSettings-skrivningen og sæt loft i hukommelsen; ikke målt på enhed
  åbent_punkt_11: JSON-RPC-id læses som tal (toLongLong) — streng-id'er ville blive læst som 0; agenten har kun vist numeriske id'er på wire (målt), så risikoen er lav (kodelæsning review 2026-11-09)
  åbent_punkt_12: app-log i /tmp kan indeholde samtaletekst i klartekst — lokal fil på enheden, truncateres pr. kørsel af eksekver_test.sh, kommer aldrig i repoet (accepteret; kodelæsning review 2026-11-09)
  åbent_punkt_13: afgjort 2026-11-10 — to kørsler på samme revision 23f0b34 gav outputs=0 (FAIL) hhv. outputs=1 (PASS) med ellers identiske felter: klienten fanger diff/uddata når agenten sender dem, så FAIL skyldtes agentens værktøjsvalg uden content-blokke, ikke et klient-tab; besluttet 2026-11-10 (sufflør): proben gøres deterministisk med shell-kommando hvis uddata altid skal følge med (se selvtest.tilstand)
  åbent_punkt_14: scriptets ventetid på 60s = watchdog 30s efter agent-processtart + 30s buffer, men app-opstartstiden er ikke målt på enheden — mål den ved en selvtest-kørsel og sæt loftet som ulighed med den målte værdi, ikke et rundt tal (review ki_quick 2026-11-10)
  åbent_punkt_15: LUKKET — målt på enheden 2026-11-12 (selvtest_b45759d: alle tre revisionsfelter i kendelsen, ens) — oprindelig tekst: lukket i kode først; kun symptomet er målt (c82aa02-kørslen manglede byg_revision= mens script_revision-linjen påstod nyere udgave); mekanismen (git omdøber ved pull, kørende skal beholder gammel inode, derfor hele den gamle udgave) er kodelæsning, ikke målt; fix i koden: sammenlign HEAD før/efter pull, genstart via exec med start-revision i miljøvariabel, også når før-værdien er tom (review ki_quick 2026-11-12)
  åbent_punkt_16: scriptets kill rammer kun GUI-processen — vibe-acp er dens QProcess-barn og får intet signal; en dræbt app kan efterlade en kørende agent, som viser sig som uforklarligt forbrug, ikke som fejl (kodelæsning review ki_quick 2026-11-12; fix kunne være at dræbe procesgruppen (kræver setsid ved start — nohup … & giver ikke egen gruppe, så kill -TERM -$APP_PID virker ikke som naivt antaget) eller at appen sender session/cancel før nedlukning (den gør det ved stop, men ikke når scriptet dræber den)
  åbent_punkt_17: ordbogsbaseret stavning af nøgler (hunspell-da) afventet — først måles dækningen (R9: flagrer den foer/naar/aar, er ordbogsvejen udelukket); hvidlisten udvanding_tilladt er den operative kontrol indtil da (review ki_quick 2026-11-12)
  åbent_punkt_18: kendelsen bar genoptaget=ja samtidig med session_load=fravalgt under selvtest — nu målt i tre kørsler (R13/selvtest_68c2b42, R23/selvtest_e394164, R31/selvtest_a5ded0d), altså reproducerbart; filen definerer ikke hvad genoptaget måler når selvtest altid kører session/new (replayed_user=1 er kun probens ekko) — undersøg src/acpclient.cpp før nogen forklaring; ikke gættet (review ki_quick 2026-11-12)
  åbent_punkt_20: guard-tjek 2 (src/qml mod config) kører kun med base-argument, og CI giver base kun ved pull_request — en ændring i src/ alene kan nå main uden den kontrol (review ki_quick 2026-11-12)
  åbent_punkt_19: last_text indeholder probe og helt agentsvar sammenklistret uden mellemrum — nu målt i tre kørsler (R13, R23, R31); selvtest.genoptagelse påstår «last_text kun probe+svar» (målt på 18de24d) — uafgjort om sammenklistringen sker i app eller agent, ikke konkluderet (review ki_quick 2026-11-12)

operationel_implementering:
  tilstand_bestået_med_åbent_punkt: accepteret — en skive kan være bestået mens et åbent punkt står, hvis punktet kun begrænser manuel efterprøvning og ikke selvtest (review 2026-11-10)
  workflow: Ingen fjern-pipes; agent lokalt via uv (~/.local/bin/vibe-acp); RPM bygges i CI
  verifikation: Unit tests og aarch64 RPM-byg i GitHub Actions; testkørsler på enheden selv via eksekver_test.sh (test-rpm-gren, anonym curl, log fra /tmp)
  succes_kriterium: CI grønt og prompt-tur målt på enheden — svar vist, app afslutter med exit-kode 0

vejkort:
  skive_byg: accept — pr_byg.yml grønt i Actions (enhedstests + tjek_config + aarch64 RPM-byg + publicering på test-rpm via publicer_test_rpm); enhed røres ikke
  skive_rygrad: accept — på enheden måles prompt sendt, svar vist, exit-kode 0
  skive_værktøjskald: accept — kald vist i UI med kind, titel og detalje; selvtest-verdict kræver tool_calls>0 og ui_tool_calls>0 (ikon efter kind kommer senere)
  skive_tilladelser: accept — dialog viser kind og fuld kommando; Stop sender session/cancel før cancelled
  skive_diff: accept — filændring som diff; kommando viser uddata; begrænsning: efter 2511810 rører ingen automatisk enhedsprøve diff-visning — dækket af unit-prøven diff_blokk_samles og målt på 3bd9a6b (diffs=2, outputs=1); selvtest tester kun outputs>0 deterministisk fordi proben selv garanterer uddata (se selvtest.pass_kriterier)
  skive_konfiguration: accept — configOptions vises og kan ændres
  skive_genoptagelse: accept — gammel samtale vises efter genstart (klient-side historik i QSettings); session/load svarer ok når mcpServers:[] medsendes (målt 2026-11-09); uden mcpServers svarer agenten -32602 — se målt_på_wire.session_load; beviset for genoptagelse (session_load=fallback + genoptaget=ja) er målt på revision b5192b8 før selvtest blev frisk-session (18de24d); session/load-grenen røres af unit-prøverne load_ok_saetter_session, load_fallback_ved_fejl og load_ok_starter_selvtest_probe (køres i CI ved hver push til main), på enheden kun ved manuel prøvetur (åbent_punkt_09)
  skive_oprydning: accept — træet indeholder ingen fil, config.yaml ikke nævner (se inventar)

