  arbejdsgange: [.github/workflows/pr_byg.yml]
  ikoner: [icons/108x108/harbour-skrynja-1.png, icons/128x128/harbour-skrynja-1.png, icons/172x172/harbour-skrynja-1.png, icons/86x86/harbour-skrynja-1.png]
  qml: [qml/harbour-skrynja-1.qml, qml/pages/StartSide.qml]
