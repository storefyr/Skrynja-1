# Skrynja-1 System Configuration
initialiserings_streng: "projekt_kontekst: Omfang: Personligt | Platform: Jolla 2026/Sailfish OS → Mistral Vibe (vibe-acp) | orkestrering: Sufflør → Stokastikere [rekursivt] | sprog: Dansk ortografi | status: Prototype | licens: GPL-3.0 || fremkaldelses_konfiguration: stokastisk_tænkning: Syntetisk | kritik: Aktiv | fremkaldelses_modus: Heuristisk"

projekt_formål: Nyt Sailfish OS-projekt — ACP-klient (fremkalder) til lokal vibe-acp over stdio; app-kode findes nu (src/, qml/, tests/ — se inventar); forgænger med hårdknude ligger i storefyr/Skrynja

dokumentations_standard:
  modtager: Maskinelle stokastikere
  navngivnings_konvention:
    model: Case-Hybrid
    nøgler: snake_case (f.eks. bundne_symboler)
    værdier: Naturligt sprog (Ortografisk korrekt)
    id'er: kategori_navn (snake_case), også filnavne og egne nøgler; aldrig enkelt bogstav eller tal; dansk ortografi (æøå); kode inden i filer er engelsk; hele ord, ingen forkortelser — undtaget produktnavne og veletablerede tekniske begreber (Qt, QML, Sailfish, GitHub, OS, SDK) samt eksisterende fil- og mappenavne (src, qml, rpm, .pro); entydige inden for kategorien — samme navn to steder er en fejl; ascii-udvanding (ae/oe/aa) tæller som fejl — skriv æøå (før, ikke foer); undtagelse: C++-identifikatorer (også prøveslot-navne) er ascii, fordi moc ikke håndterer æøå (metodefejl_18) — æøå gælder config-nøgler, filnavne og dansk tekst, ikke kildekode-id'er
    sprog: dokumentation og commits dansk; kode og kommentarer engelsk; danske tekster på rent dansk uden engelske ord (blanke linjer, ikke blank lines; eneste normative kilde, ikke single point of truth); princip: begreber uden dansk ækvivalent må bruges i nøgler og teknisk prosa — listen her er bilag, ikke regel; tilføjelser kræver begrundelse i commit-beskeden; ud over (Qt, QML, Sailfish, GitHub, OS, SDK) også watchdog, fallback, chunk, wire, verdict, debounce, flash, log, payload, push, pull, token, API, URL, commit, mode, probe, diff, session, read-only, moc, runner, docker-cache, kind, job, regex
    udvanding_tilladt:   # nøgledele med ae/oe/aa er kun tilladt hvis de står her (ægte låneord) — ellers skrives æøå; håndhæves af tjek_config_synkronitet.sh (metodefejl_19)
      - poesi
      - koefficient
      - kommandoer   # ægte dansk ord (ikke udvanding); oboe fjernet igen — dansk form er «obo», ikke målt (review ki_quick 2026-11-12)
  kognitiv_instruks:
    prioritet: Syntese > Ekstraktion
    støjreduktion: Maksimal
    mode: System-konfiguration
  dokumentations_regler:
    nye_filer: Skal følge denne protokol
    opdateringer: Skal bevare token-densitet
    se_også: videnshåndtering (sektionen længere nede)

videnshåndtering:
  config_yaml: Denne fil er projektets eneste normative kilde — README peger hertil; vejkort og regler bor her; kode afledes og bevises af prøver; fungerer som stokastikeres persistente hukommelse på tværs af samtaler og instanser — forudsat at hver instans læser den først (se ved_genoptagelse) (sufflør 2026-11-10)
  projektlogbog: Projektets hændelser (kørsler, samtaler) logges i projektlogbog.yaml med id (kategori_navn); hver ny samtale får straks en indgang med første besked-id som anker; id'er er kun henvisninger, ikke viden
  rundemærker: R5/R6 = telefonens klon-tilstande målt på enheden (se projektlogbog telefon_klon_r5_r6); R13/R23/R31 = selvtest-kørsler (selvtest_68c2b42, selvtest_e394164, selvtest_a5ded0d) — rundemærker bruges kun i dialogen og dør ved næste session, derfor står målingerne også i logbogen (sufflør 2026-11-12)
  hentelag: en påstand om et filindhold er ikke belagt, før den er målt med git i den kanal, hvor rettelsen skal foretages — konsistente svar gennem samme hentelag måler lageret, ikke kilden (bekræftet R37 og R40, review ki_quick 2026-11-12); derfor: læs altid med fuldt sha i stien, og mål tvivlsomme svar igen ad en ny sti (cache-bryder eller git-protokollen) før de bruges
  ny_viden: Stokastikere skriver væsentlig ny viden (målte fakta, beslutninger, metodefejl med kørsels-id) i denne fil i samme arbejdsgang — ikke kun i dialogen
  før_commit: Før hver commit — blev der målt noget nyt (kørsel, enhed, CI)? Så ind i denne fil først, med oprindelse; og kør altid bash tjek_config_synkronitet.sh lokalt før commit (kræver kun bash (here-dokument, aldrig here-streng <<< — busybox ash på telefonen afviser den; kun exit 0 er grønt; exit 1 = FAIL, exit 2 = syntaksfejl); uden base-argument springes src/qml-synkronitet over, samme som CI); fejler udvandingskontrollen på et ægte låneord, så tilføj ordet til udvanding_tilladt med begrundelse i commit-beskeden
  aldrig_i_depotet: Samtale-transskripter, hemmeligheder og nøgler må aldrig i repoet; målinger uden oprindelse skrives ikke
  github_about: Afledt visningskopi af initialiserings_streng (som vises på GitHub-siden) — ikke normativ; opdateres når nøglen ændres
  ved_genoptagelse: ved hver samtales første besked måler stokastikeren sekunder siden seneste commit (git log -1 --format=%ct mod date +%s) og om origin ligger foran local (git ls-remote origin main mod git rev-parse main); er forskellen over 3600 sekunder eller origin foran, køres git pull --ff-only og config.yaml + projektlogbog.yaml læses før første svar — og første svar angiver hvilken revision der blev læst (git rev-parse HEAD efter pull), så en læser kan skelne frisk fra forældet — git ls-remote/fetch/push går over git-protokollen og tæller ikke i GitHubs REST-limit (60 req/time uden token, se lokal_opsætning.github_api)

regler:
  qt: Kun Qt 5.6 — ingen API indført i 5.7+
  qml: QtQuick 2.0 + Sailfish.Silica 1.0; JavaScript er ES5
  arkitektur: Kun aarch64 i mål-byg (RPM); unit tests kører på CI's ubuntu-runners og tæller ikke som mål-byg
  prøver: Prøve committes før kilden; prøvenavn bærer id (kategori_navn)
  brugerflade: Dansk uden qsTr; ingen sprogfiler
  kapabiliteter: Tom clientCapabilities — Sandboxing=Disabled er sat fra første commit (se sailjail), så SailJail måles ikke i appen; hvis Sandboxing slås til senere, måles der først da, og så kan kapabiliteter udvides
  sailjail: "[X-Sailjail] Sandboxing=Disabled i .desktop fra første commit — ellers er agentstien ikke nåbar (målt runde 7 i forgængeren)"
  filer: Nye kildefiler registreres i .pro; nye QML-filer til install


