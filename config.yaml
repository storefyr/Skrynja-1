# Skrynja-1 System Configuration
initialiserings_streng: "projekt_kontekst: Omfang: Personligt | Platform: Jolla 2026/Sailfish OS → Mistral Vibe (vibe-acp) | orkestrering: Sufflør → Stokastikere [rekursivt] | sprog: Dansk ortografi | status: Prototype | licens: GPL-3.0 || fremkaldelses_konfiguration: stokastisk_tænkning: Syntetisk | kritik: Aktiv | fremkaldelses_modus: Heuristisk"

projekt_formål: Nyt Sailfish OS-projekt — ACP-klient (fremkalder) til lokal vibe-acp over stdio; ingen app-kode endnu; forgænger med hårdknude ligger i storefyr/Skrynja

dokumentations_standard:
  modtager: Maskinelle stokastikere
  navngivnings_konvention:
    model: Case-Hybrid
    nøgler: snake_case (Bonded_Tokens)
    værdier: Naturligt sprog (Ortografisk korrekt)
    id'er: kategori_navn (snake_case), også egne nøgler; aldrig enkelt bogstav eller tal; dansk ortografi (æøå); kode inden i filer er engelsk; hele ord, ingen forkortelser — undtaget produktnavne og veletablerede tekniske begreber (Qt, QML, Sailfish, GitHub, OS, SDK) samt eksisterende fil- og mappenavne (src, qml, rpm, .pro), der beholdes som de er; øvrige forkortelser skrives helt ud
    sprog: dokumentation og commits dansk; kode og kommentarer engelsk; danske tekster på rent dansk uden engelske ord (blanke linjer, ikke blank lines)
  kognitiv_instruks:
    prioritet: Syntese > Ekstraktion
    støjreduktion: Maksimal
    mode: System-konfiguration
  dokumentations_regler:
    nye_filer: Skal følge denne protokol
    opdateringer: Skal bevare token-densitet
    config_yaml: Denne fil er projektets eneste normative kilde — README peger hertil; vejkort og regler bor her; kode afledes og bevises af prøver
    github_about: Afledt visningskopi af initialiserings_streng — ikke normativ; opdateres når nøglen ændres
    ny_viden: Stokastikere skriver væsentlig ny viden (målte fakta, beslutninger, metodefejl med kørsels-id) i denne fil i samme arbejdsgang — ikke kun i dialogen

regler:
  qt: Kun Qt 5.6 — ingen API indført i 5.7+
  qml: QtQuick 2.0 + Sailfish.Silica 1.0; JavaScript er ES5
  arkitektur: Kun aarch64
  prøver: Prøve committes før kilden; prøvenavn bærer id (kategori_navn)
  brugerflade: Dansk uden qsTr; ingen sprogfiler
  kapabiliteter: Tom clientCapabilities indtil SailJail er målt
  sailjail: "[X-Sailjail] Sandboxing=Disabled i .desktop fra første commit — ellers er agentstien ikke nåbar (målt runde 7 i forgængeren)"
  filer: Nye kildefiler registreres i .pro; nye QML-filer til install; nye filer i træet nævnes i inventar

inventar:
  rod: [config.yaml, README.md, LICENSE, .gitignore, eksekver_test.sh, harbour-skrynja-1.desktop, harbour-skrynja-1.pro, harbour-skrynja-1.yaml]
  arbejdsgange: [.github/workflows/pr_byg.yml]
  ikoner: [icons/86x86/harbour-skrynja-1.png, icons/108x108/harbour-skrynja-1.png, icons/128x128/harbour-skrynja-1.png, icons/172x172/harbour-skrynja-1.png]
  qml: [qml/harbour-skrynja-1.qml, qml/pages/StartSide.qml]
  rpm: [rpm/harbour-skrynja-1.spec]
  src: [src/acpclient.cpp, src/acpclient.h, src/acpframereader.cpp, src/acpframereader.h, src/main.cpp]
  tests: [tests/tests.pro, tests/tst_main.cpp, tests/fixtures/fixture_rygrad.ndjson, tests/fixtures/fixture_rygrad_sammenklæbning.ndjson, tests/fixtures/fixture_rygrad_ugyldig.ndjson, tests/fixtures/fixture_rygrad_utf8_ugyldig.ndjson]

projekt_ordbog:
  sufflør: Det menneskelige led, der guider og korrigerer maskinelle stokastikere via præcise instruktioner.
  skrynja: Nynorsk for skrøne. Symbol på den maskinelle stokastikers tendens til fiktive narrativer.
  fremkaldelse: Processen med at bringe en specifik operationel tilstand eller identitet frem i en stokastiker.
  rekursiv_orkestrering: Styringsstruktur, hvor en stokastiker instrueres i at sufflere en anden stokastiker.
  maskinel_stokastiker: Stor sprogmodel (LLM), der opererer som eksekverende part under sufflørstyring.
  hårdknude: Udviklingsmæssig blindgyde eller systemisk fejl, hvor tilgangen fører til uoverstigelige problemer.
  ortografisk_krav: Krav om streng overholdelse af danske stave- og skrive-regler.
  kildekodelager: Det centrale depot for projektets kildekode, hvor versionsstyring og historik administreres.

arkitektonisk_logik:
  struktur: RekursivOrkestrering
  flow: Sufflør → Stokastiker[n] → Output
  særlige_instrukser:
    rekursion: Stokastiker[n] kan sufflere Stokastiker[n+1]
    mål: Distribution af kognitiv belastning via lagdeling for at undgå systemiske hårdknuder

teknisk_stack:
  hardware:
    enhed: Jolla Phone 2026 — eneste enhed (sufflør 2026-11-07)
    os: Sailfish OS 5.2.0.20 (Finlayson)
    arkitektur: aarch64
    kernel: 6.12.38-4k
  maskiner:
    eneste_enhed: Jolla Phone 2026 — al projektfremdrift, agent-kørsel og stokastiker-dialogen foregår på denne ene enhed (sufflør 2026-11-07); mistral_vibe 3.0.2 + agent_client_protocol 0.11.0; vibe-acp via uv (~/.local/bin/vibe-acp); ingen separat målmaskine eller udviklermaskine
    arbejdsgange: GitHub Actions ubuntu-runners; Sailfish SDK-image 4.5.0.18-aarch64 — grøn i kørsel 42415519785
  integration:
    kerne_model: Mistral Vibe
    protokol: vibe-acp_ndjson_stdin_stdout
    implementering: Lokal_uv
  byg:
    sti: CI (GitHub Actions bygger aarch64 RPM); enheden bruges kun til install, kørsel og måling
    sdk_release: '4.5.0.18'
    sdk_note: 5.2.0.20-aarch64 findes ikke i ghcr.io (manifest unknown, kørsel 42415397767); 4.5.0.18-aarch64 er grøn i forgængerens CI og kører på enhedens 5.2.0.20
  standarder:
    ortografi: Dansk ortografi
    licens: GPL-3.0

selvtest:
  tilstand: appen kører med --selvtest, sætter mode ask via session/set_config_option og sender selv probe-prompten (opret filen /tmp/skrynja-1-probe.txt med teksten OK), venter på end_turn
  verdict_fil: /tmp/skrynja-1-selvtest.txt med tool_calls, ui_tool_calls, last_text, VERDICT og exit-kode
  pass_kriterier: tool_calls større end 0, ui_tool_calls større end 0 (sættes af QML via acp.uiToolCallsSeen) og permission_requests større end 0 (selvtest sætter mode ask først)
  kørsel: eksekver_test.sh på telefonen viser også testet revision fra revision.txt på test-rpm

lokal_opsaetning:
  maskiner_og_programmel: én fysisk enhed (teknisk_stack.maskiner.eneste_enhed) + CI — ingen ekstern udviklermaskine
  sufflør_viden: Så godt som ingen viden om GitHub, gh og git (sufflør 2026-11-07) — maskinsiden udfører alle git/gh-operationer; instruktioner til sufflør må ikke forudsætte git-kendskab
  testkørsel: eksekver_test.sh kører på telefonen selv — henter og installerer seneste RPM fra test-rpm (anonym curl, fast URL) sammen med revision.txt (hvilken commit der blev testet), kører derefter automatisk appen med --selvtest (probe-prompt, verdict i /tmp/skrynja-1-selvtest.txt) og viser filtrerede loglinjer fra /tmp; ingen manuel start eller prompt nødvendig
  forbudt: ingen fjern-pipes

sufflør_protokol:
  interaktions_model:
    hierarki: Sufflør → Stokastiker
    svar_krav: Funktionel præcision
    loop: Kritik aktiv
  svar_modus:
    format: Teknik fremfor narrativ
    filter: Ingen høflighedsfraser
    prioritet: Operationel løsning > Teoretisk perfektion
    kommandoer: Blanke linjer før hver kommando-blok i svaret, så de er nemme at kopiere (sufflør 2026-11-08)

anti_mønstre:
  metodiske_fejl:
    - id: metodefejl_01
      metode: QJsonParseError::ExtraData antaget (navn fra nyere Qt)
      resultat: byg fejlede — ExtraData findes ikke i Qt 5.6 (kørsel 42489084980)
      lektie: Qt 5.6 hedder det GarbageAtEnd, samme offset-semantik
    - id: metodefejl_02
      metode: over-loft-linje satte discard-tilstand uden nulstilling ved linjeskift
      resultat: næste gyldige linje blev også kasseret, prøve rygrad_cap fejlede (kørsel 42489244332)
      lektie: tæller nulstilles når linjen er komplet; kun ufuldstændig buffer går i discard
    - id: metodefejl_03
      metode: håndskrevet testlinje med en ekstra lukkeparentes
      resultat: parser kasserede korrekt med illegal value, prøven fejlede (kørsel 42490284528)
      lektie: test-JSON valideres maskinelt før commit
    - id: metodefejl_04
      metode: EnterKey.onClicked sat til signal-kald sendButton.clicked() som udtryk
      resultat: QML-fejl Insufficient arguments på Qt 5.6 (app-log 2026-11-08T15:26)
      lektie: en handler kalder en funktion, ikke et signal som funktionsudtryk
    - id: metodefejl_05
      metode: SDK-release valgt efter enhedens OS-version (5.2.0.20)
      resultat: docker-image 5.2.0.20-aarch64 findes ikke, manifest unknown (kørsel 42415397767)
      lektie: byg efter et SDK-image der faktisk findes i registret (4.5.0.18); enhedens OS er noget andet
    - id: metodefejl_06
      metode: selvtest læste uiToolCalls på view->rootObject() (vinduet) i stedet for Page
      resultat: ui_tool_calls=-1 og VERDICT=FAIL selvom UI viste kaldet (selvtest på enhed 2026-11-08)
      lektie: læs samme objekt som QML viser — findChild på side-id, ikke rootObject
    - id: metodefejl_07
      metode: rootObject() brugt uden #include <QQuickItem>
      resultat: RPM-byg fejlede med invalid use of incomplete type (kørsel 42495526218)
      lektie: rootObject() returnerer QQuickItem*, som skal includes før brug
    - id: metodefejl_08
      metode: C++ læste QML-state via property-opslag og parent-kæde (Item.parent stopper før vinduet; QML-id'er er fil-scopede)
      resultat: ui_tool_calls målte -1 så 0 og selvtest FAIL, selvom UI viste kaldet (målt på enhed 2026-11-08, revision 849c36b og 81d9955)
      lektie: QML kalder selv tilbage til C++ via Q_INVOKABLE (acp.uiToolCallsSeen) — mål dér, ikke i QML-træet
    - id: metodefejl_09
      metode: Qt foreach-makroen brugt i app-kode
      resultat: byg fejlede med lambda-expression in unevaluated context i Sailfish SDK (kørsel 42499995419)
      lektie: brug almindelig for-løkke over QJsonArray i app-koden på denne platform
  systemiske_hårdknuder:
    - id: hårdknude_01
      beskrivelse: Afvisnings-loop i forgængeren storefyr/Skrynja (målt runde 12c-12f) — cancelled stoppede ikke agenten; 9x request_permission, 7x cancelled, 14 unikke toolCallIds
      løsning: To handlinger fra start — Stop sender session/cancel før cancelled; Afvis afviser kun den enkelte anmodning

målt_på_wire:
  kilde: app-log /tmp/skrynja-1-app.log på Jolla Phone 2026, 2026-11-08T15:25-15:26
  initialize_svar: protocolVersion 1, agentInfo @mistralai/mistral-vibe 3.0.2, authMethods inkl. browser-auth
  session_new_svar: sessionId som UUID, currentModeId accept-edits, configOptions med mode/model/thinking, modes ask/accept-edits/smart-approve/auto-approve
  update_typer: session/update med agent_message_chunk, agent_thought_chunk, user_message_chunk, usage_update, available_commands_update, tool_call — klienten viser pt. kun agent_message_chunk og tool_call
  prompt_svar: svar med result stopReason end_turn og usage
  request_permission: målt i forgængeren (runde 11/12) — anmodninger med id 0/1 og options (optionId og name), tom titel kan forekomme; cancelled uden session/cancel stoppede ikke agenten (hårdknude_01)

åbne_punkter:
  åbent_punkt_01: løst 2026-11-08 — selvtest på enheden gav tool_calls=1 og VERDICT=PASS (agenten sender tool_call, klienten fanger det)
  åbent_punkt_02: løst 2026-11-08 — selvtest PASS på revision 7a3f52e med tool_calls=1 og ui_tool_calls=1 (QML-callback uiToolCallsSeen målte, at UI-bindingen kørte)
  åbent_punkt_03: selvtest-verdict tjekker kun mængder (tool_calls/ui_tool_calls/permission_requests større end 0 i finishSelvtest), ikke at probe-filen /tmp/skrynja-1-probe.txt fik indholdet OK — PASS beviser rørføring, ikke korrekthed
  åbent_punkt_04: beviser uden for repoet forældes (app-log og verdict i /tmp på enheden, Actions-logs udløber, prøveaftryk i logfil uden for repoet) — kun kørsels-id og revision ligger permanent i git

operationel_implementering:
  workflow: Ingen fjern-pipes; agent lokalt via uv (~/.local/bin/vibe-acp); RPM bygges i CI
  verifikation: Unit tests og aarch64 RPM-byg i GitHub Actions; testkørsler på enheden selv via eksekver_test.sh (test-rpm-gren, anonym curl, log fra /tmp)
  succes_kriterium: CI grønt og prompt-tur målt på enheden — svar vist, app afslutter med exit-kode 0

vejkort:
  skive_byg: accept — pr_byg.yml grønt i Actions (unit tests + aarch64 RPM); enhed røres ikke
  skive_rygrad: accept — på enheden måles prompt sendt, svar vist, exit-kode 0
  skive_værktøjskald: accept — kald vist i UI med kind, titel og detalje; selvtest-verdict kræver tool_calls>0 og ui_tool_calls>0 (ikon efter kind kommer senere)
  skive_tilladelser: accept — dialog viser kind og fuld kommando; Stop sender session/cancel før cancelled
  skive_diff: accept — filændring som diff; kommando viser uddata
  skive_konfiguration: accept — configOptions vises og kan ændres
  skive_genoptagelse: accept — samtale vises korrekt efter genstart
  skive_oprydning: accept — træet indeholder ingen fil, config.yaml ikke nævner (se inventar)

fremdrift:
  skive_byg: bestået 2026-11-08 — CI 42488263292 grøn (tests + aarch64 RPM), ikoner med i RPM, installeret på enheden via eksekver_test.sh
  skive_rygrad: bestået 2026-11-08 — sufflør målte på Jolla Phone 2026 (prompt sendt, svar vist); CI 42489420931 grøn, 9/9 parser-prøver
  skive_værktøjskald: bestået 2026-11-08 — selvtest PASS på enheden, revision 7a3f52e (tool_calls=1, ui_tool_calls=1, exit 0); CI 42498254260 grøn, 15/15 prøver
