  tests: [tests/fixtures/fixture_rygrad.ndjson, tests/fixtures/fixture_rygrad_sammenklæbning.ndjson, tests/fixtures/fixture_rygrad_ugyldig.ndjson, tests/fixtures/fixture_rygrad_utf8_ugyldig.ndjson, tests/tests.pro, tests/tst_main.cpp]
