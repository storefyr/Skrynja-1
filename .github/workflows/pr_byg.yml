name: pr_byg

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  SAILFISH_RELEASE: '4.5.0.18'

jobs:
  enhedstests:
    name: Enhedstests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installer Qt5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake make g++
      - name: Byg tests
        run: |
          export PATH=/usr/lib/qt5/bin:$PATH
          cd tests
          qmake tests.pro
          make -j2
      - name: Kør tests
        run: cd tests && ./tst_skrynja_1

  byg:
    name: Byg RPM (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Byg RPM
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: aarch64
          release: ${{ env.SAILFISH_RELEASE }}
          fix-version: false
      - name: Tjek at RPM blev bygget
        run: |
          if [ -z "$(find RPMS -name '*.rpm' -type f)" ]; then
            echo "Fejl: ingen RPM blev bygget"
            exit 1
          fi
          ls -lh RPMS/*.rpm
      - name: Upload RPM-artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-aarch64
          path: RPMS/*.rpm
      - name: Publicer RPM på test-rpm-grenen
        run: |
          set -e
          RPM_FILE=$(ls RPMS/harbour-skrynja-1-*.rpm | head -1)
          git config user.email "ci@skrynja-1.local"
          git config user.name "pr_byg CI"
          git checkout -B test-rpm
          cp "$RPM_FILE" skrynja-1-test.aarch64.rpm
          echo "${{ github.sha }}" > revision.txt
          git add skrynja-1-test.aarch64.rpm revision.txt
          git commit -m "testkørsel ${{ github.sha }}"
          git push --force origin test-rpm
          echo "Publiceret revision ${{ github.sha }} på test-rpm"
          echo "Publiceret: raw.githubusercontent.com/storefyr/Skrynja-1/test-rpm/skrynja-1-test.aarch64.rpm"
