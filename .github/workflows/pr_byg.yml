name: pr_byg

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  SAILFISH_RELEASE: '4.5.0.18'

jobs:
  enhedstests:
    name: Enhedstests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Installer Qt5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake make g++
      - name: Byg tests
        run: |
          export PATH=/usr/lib/qt5/bin:$PATH
          cd tests
          qmake tests.pro
          make -j2
      - name: Kør tests
        run: cd tests && ./tst_skrynja_1

  byg:
    name: Byg RPM (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Byg RPM
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: aarch64
          release: ${{ env.SAILFISH_RELEASE }}
          fix-version: false
      - name: Tjek at RPM blev bygget
        run: |
          if [ -z "$(find RPMS -name '*.rpm' -type f)" ]; then
            echo "Fejl: ingen RPM blev bygget"
            exit 1
          fi
          ls -lh RPMS/*.rpm
      - name: Upload RPM-artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-aarch64
          path: RPMS/*.rpm
