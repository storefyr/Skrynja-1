name: pr_byg

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

env:
  SAILFISH_RELEASE: '4.5.0.18'

jobs:
  enhedstests:
    name: Enhedstests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Installer Qt5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qtbase5-dev qtbase5-dev-tools qt5-qmake make g++
      - name: Byg tests
        run: |
          export PATH=/usr/lib/qt5/bin:$PATH
          cd tests
          qmake tests.pro
          make -j2
      - name: Kør tests
        run: cd tests && ./tst_skrynja_1

  byg:
    name: Byg RPM (aarch64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Byg RPM
        uses: R1tschY/sailfish-build-rpm@v1
        with:
          arch: aarch64
          release: ${{ env.SAILFISH_RELEASE }}
          fix-version: false
      - name: Tjek at RPM blev bygget
        run: |
          if [ -z "$(find RPMS -name '*.rpm' -type f)" ]; then
            echo "Fejl: ingen RPM blev bygget"
            exit 1
          fi
          ls -lh RPMS/*.rpm
      - name: Upload RPM-artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-aarch64
          path: RPMS/*.rpm
      - name: Publicer RPM og udpakket payload på test-rpm-grenen
        if: github.event_name == 'push'
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y rpm2cpio cpio
          RPM_FILE=$(ls RPMS/harbour-skrynja-1-*.rpm | head -1)
          RPM_ABS="$(cd "$(dirname "$RPM_FILE")" && pwd)/$(basename "$RPM_FILE")"
          PAY=/tmp/skrynja-1-payload
          rm -rf "$PAY" && mkdir -p "$PAY"
          (cd "$PAY" && rpm2cpio "$RPM_ABS" | cpio -idm)
          tar -czf skrynja-1-test.tar.gz -C "$PAY" usr
          git config user.email "ci@skrynja-1.local"
          git config user.name "pr_byg CI"
          git checkout -B test-rpm
          cp "$RPM_FILE" skrynja-1-test.aarch64.rpm
          sha256sum skrynja-1-test.aarch64.rpm > skrynja-1-test.aarch64.rpm.sha256
          sha256sum skrynja-1-test.tar.gz > skrynja-1-test.tar.gz.sha256
          echo "${{ github.sha }}" > revision.txt
          git add skrynja-1-test.aarch64.rpm skrynja-1-test.aarch64.rpm.sha256 skrynja-1-test.tar.gz skrynja-1-test.tar.gz.sha256 revision.txt
          git commit -m "testkørsel ${{ github.sha }}"
          git push --force origin test-rpm
          echo "Publiceret revision ${{ github.sha }} på test-rpm (RPM + tar.gz)"

  tjek_config:
    name: Tjek config-synkronitet
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Tjek inventar (alle filer i træet nævnt i config.yaml)
        run: ./tjek_config_synkronitet.sh
      - name: Tjek synkronitet ved PR (src/qml skal også røre config.yaml)
        if: github.event_name == 'pull_request'
        run: ./tjek_config_synkronitet.sh "${{ github.event.pull_request.base.sha }}"
